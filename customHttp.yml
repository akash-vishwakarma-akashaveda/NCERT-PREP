# AWS Amplify Hosting response headers (read from the repo root on each build).
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
  # Hashed build files never change, so browsers may keep them for a year.
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # The HTML shell must always be fresh so a new release shows up straight away.
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: no-cache
