# Netlify build and hosting for the Vite SPA (backend stays on Firebase).
# Set the VITE_* values in Netlify → Site configuration → Environment variables.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_* values are public by design: Vite inlines them into the browser bundle, and security comes from
  # Firebase rules and App Check. Scanning them only produces false positives (e.g. the region "us-central1").
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_FUNCTIONS_REGION,VITE_RECAPTCHA_V3_SITE_KEY,VITE_GRIEVANCE_OFFICER_NAME,VITE_GRIEVANCE_EMAIL"

# Single-page app: every route (/app, /browse, /app/lesson/...) serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Hashed build files never change, so browsers may keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must always be fresh so a new release shows up straight away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
