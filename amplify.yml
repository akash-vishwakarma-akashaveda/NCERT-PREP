# AWS Amplify Hosting build for the Vite SPA. The backend stays on Firebase.
# Environment variables (VITE_*) are set in Amplify console → Hosting → Environment variables.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
